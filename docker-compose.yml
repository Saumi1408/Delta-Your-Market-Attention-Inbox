services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: delta
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta
    ports: ["5432:5432"]
    volumes: ["delta-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  delta-postgres:
