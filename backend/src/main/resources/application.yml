spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/delta;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
delta:
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  freshness:
    live-seconds: 60
    stale-seconds: 300
